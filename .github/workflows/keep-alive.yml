name: Keep database alive

# Supabase paket gratis dijeda setelah ~7 hari tanpa aktivitas.
# Workflow ini memanggil /api/health (menjalankan SELECT 1) setiap hari.
# Butuh secret repo: SITE_URL (mis. https://sekenkos.id) dan CRON_SECRET.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/health"
